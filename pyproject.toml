[project]
name = "civiclens-ai"
version = "0.1.0"
description = "First-person multimodal and embodied intelligence platform."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["services/perception/src"]
include = ["civiclens_perception*"]
